stages:
  - test
  - build
  - security

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "api-devsecops:$CI_COMMIT_SHORT_SHA"

# 🛡️ TASK 1: Scanner de Infraestrutura (IaC) com Checkov
checkov-scan:
  stage: test
  image: 
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov -d infra/
  allow_failure: false

# 🔍 TASK 2: Análise Estática de Código (SAST) com Semgrep
semgrep-sast:
  stage: test
  image: returntocorp/semgrep
  script:
    - semgrep scan --config auto --error
  allow_failure: false

# 🔑 TASK 3: Detecção de Segredos (Secrets Detection) com Gitleaks
gitleaks-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    # Vasculha o código atual e o histórico do Git atrás de chaves expostas
    # O parâmetro --redact mascara o segredo real nos logs do console para maior segurança
    - gitleaks detect --verbose --source=. --redact
  allow_failure: false

# 🐳 TASK 4: Build do Container da API
docker-build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $IMAGE_NAME .
    - docker save -o image.tar $IMAGE_NAME
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

# 🧪 TASK 5: Container Scanning & SCA com AquaSec Trivy
trivy-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  services:
    - docker:24.0.5-dind
  script:
    - docker load -i image.tar
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $IMAGE_NAME
  allow_failure: false
