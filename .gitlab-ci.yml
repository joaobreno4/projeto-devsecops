stages:
  - test
  - build
  - security

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "api-devsecops:$CI_COMMIT_SHORT_SHA"

gitleaks-scan:
  stage: test
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --source=.
  allow_failure: true

semgrep-sast:
  stage: test
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config auto --error
  allow_failure: true

checkov-scan:
  stage: test
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov -d infra/
  allow_failure: true
