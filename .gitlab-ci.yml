# Definição das etapas do nosso pipeline
stages:
  - test
  - build

# Definindo que vamos usar o Docker padrão do GitLab Runner para o Build
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# 🛡️ TASK 1: Scanner de Infraestrutura (IaC) com Checkov
checkov-scan:
  stage: test
  image: 
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    # Roda o scan especificamente na nossa pasta de infra
    - checkov -d infra/
  allow_failure: false # Se encontrar falha crítica, trava o pipeline!

# 🐳 TASK 2: Teste de Build do Container da API
docker-build:
  stage: build
  image: docker:24.0.5 # Imagem estável do Docker
  services:
    - docker:24.0.5-dind # Docker-in-Docker para permitir o build dentro do container
  script:
    # Valida se o Dockerfile compila perfeitamente
    - docker build -t api-devsecops:$CI_COMMIT_SHORT_SHA .
    - echo "Build realizado com sucesso para a tag $CI_COMMIT_SHORT_SHA"
